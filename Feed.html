        body {

        }

        main {padding: 40px 50px;}
        main h2 {margin-bottom: 30px;}
        .gallery-container {display: flex;flex-wrap: wrap;gap: 10px;}
        .gallery-container img {width: calc(25% - 10px); height: auto;}
        .artcard {
            width: 250px;
            border: 1px solid #dddddd;
            border-radius: 10px;
            overflow: hidden;
            background-color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .artcard:hover {transform: translateY(-5px);}
        .artcard img {width: 100%;height: 250px;object-fit: cover;display: block;}
        .artcard h3 {margin: 15px 15px 5px;color:#1e1e1e;}
        .artcard p { margin: 0 15px 15px;color: #1e1e1e;}
    </style>
